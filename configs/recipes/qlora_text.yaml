name: qlora_text
backend: hf_trl
method: qlora
base_model: gemma3n-e2b
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
freeze_vision: true
freeze_audio: true
quantization: nf4
max_seq_len: 4096
per_device_batch_size: 1
grad_accum: 16
epochs: 2.0
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: paged_adamw_8bit
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 200
save_steps: 200
notes: >
  Default QLoRA recipe for text-only fine-tuning on Gemma 3n E2B. Effective
  batch size 16; ~10–18 h for ~30k examples on an 8 GB Ampere GPU.
