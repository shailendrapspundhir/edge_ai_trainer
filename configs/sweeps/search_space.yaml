# Hyperparameter search space for EAT sweep engine.
# Each param maps to a recipe field that will be overridden per trial.

params:
  - name: learning_rate
    type: log_uniform
    low: 1.0e-5
    high: 1.0e-3

  - name: lora_r
    type: choice
    choices: [4, 8, 16, 32]

  - name: lora_alpha
    type: choice
    choices: [8, 16, 32, 64]

  - name: lora_dropout
    type: uniform
    low: 0.0
    high: 0.2

  - name: per_device_batch_size
    type: choice
    choices: [1, 2, 4]

  - name: warmup_ratio
    type: uniform
    low: 0.0
    high: 0.15

  - name: lr_scheduler
    type: choice
    choices: ["cosine", "linear", "constant_with_warmup"]
