name: food_health_coach
description: >
  A multimodal Gemma 3n model that gives personalised, casual dietary
  guidance. It accepts a structured user profile (conditions, allergies,
  medications, goals, preferences) plus a food signal (a photo of a plated
  meal, a packaged-food label, an ingredient list, or a free-text query)
  and produces a short verdict (eat / portion-limit / avoid), 1-3 grounded
  reasons, quantified portion guidance, and an optional follow-up question.
  Inference-time food facts are retrieved from a local food KB so the model
  reasons over given facts rather than memorising the food universe.

base_model: gemma3n-e2b

datasets:
  # --- original synthetic corpus ---
  - food_v1
  - food_vision_v1
  # --- structured data categories (generated by scripts/collect_food_data.py) ---
  - food_recognition_v1        # image → food name + cuisine
  - ingredient_extraction_v1   # food → ingredient list
  - nutrition_profile_v1       # food + serving → macro/micro table
  - health_condition_diet_v1   # condition + food → eat/limit/avoid
  - personalized_advice_v1     # user profile + food → tailored advice
  - portion_guidance_v1        # food description → grams + calories
  - allergen_detection_v1      # food → allergens (Big-9)
  - meal_planning_v1           # user profile → full-day plan
  - food_substitution_v1       # food + restriction → healthier swaps
  - multimodal_coaching_v1     # multi-turn vision+text coaching sessions

recipes:
  - qlora_text
  - qlora_vlm

targets:
  - gguf_q4km
  - gguf_q5km
  - mediapipe_litert

eval_set: food_eval_v1

system_prompt_file: prompts/system.txt
judge_prompt_file: prompts/eval_judge.txt
redteam_prompt_file: prompts/red_team.txt

notes: >
  v1 non-goals: the model must NOT produce medical diagnoses, must NOT
  prescribe or adjust medication doses, must NOT replace a registered
  dietitian or clinician, and must NOT make drug-interaction claims outside
  a small curated whitelist that ships with the project. The always-defer
  principle is the load-bearing safety rule for v1: whenever the user input
  brushes against diagnosis, dosing, eating-disorder territory, paediatric
  or pregnancy edge cases, or any condition where the answer changes a
  prescribed treatment plan, the model defers to the user's clinician,
  states this explicitly, and refuses to produce a numeric answer that
  could be mistaken for medical advice. Allergen omissions are treated as
  hard failures by the eval pipeline. The runtime grounding layer (USDA /
  Open Food Facts / IFCT lookup) provides the numerical truth the model is
  expected to reason over; the model is judged on faithful reasoning, not
  on recall of food macros.
