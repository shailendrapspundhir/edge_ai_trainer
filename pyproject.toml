[project]
name = "edge-ai-trainer"
version = "0.1.0"
description = "Local-first workbench for training, evaluating, and deploying edge AI models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Shailendra Pundhir" }]

dependencies = [
    # --- Core ---
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
    # --- Orchestration ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rq>=1.16",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    # --- Dashboard ---
    "streamlit>=1.37",
    "pandas>=2.2",
    "altair>=5.3",
    # --- Experiment tracking ---
    "mlflow>=2.14",
    # --- Data ---
    "datasets>=2.20",
    "Pillow>=10.3",
    "soundfile>=0.12",
    "librosa>=0.10",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "peft>=0.12",
    "trl>=0.10",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "tensorboard>=2.17",
]
unsloth = [
    "unsloth",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
cloud = [
    "skypilot[runpod,lambda,aws]>=0.6",
    "modal>=0.64",
    "docker>=7.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
]
android = [
    "adbutils>=2.7",
]
data-gen = [
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.scripts]
eat = "eat.cli:app"
eat-orchestrator = "eat.orchestrator.app:main"
eat-worker = "eat.orchestrator.workers:main"
eat-dashboard = "eat.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eat"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004", "PLR0915", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
